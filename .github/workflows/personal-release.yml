name: Personal Windows release

on:
  workflow_dispatch:
    inputs:
      source-sha:
        description: Reviewed 40-character SHA, must equal the selected branch's current commit
        type: string
        required: true
      version:
        description: Reviewed Cargo.toml version, numeric X.Y.Z and newer than existing tags
        type: string
        required: true
      review-note:
        description: Source review reference and accepted findings for this exact commit
        type: string
        required: true

permissions:
  contents: read

jobs:
  draft:
    permissions:
      contents: write
    uses: ElliottHitch/craft-launcher/.github/workflows/personal-windows.yml@bd340bef9cea4264b9289613ceb40bca7c03f009
    with:
      app-id: wordcraft
      source-sha: ${{ inputs.source-sha }}
      version: ${{ inputs.version }}
      review-note: ${{ inputs.review-note }}
